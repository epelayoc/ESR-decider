[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decider"
version = "0.1.0"
description = "Cliente unificado para interactuar con modelos TYPESAFE y LIQUIDAI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typesafe-sdk",
    "transformers>=5.19",
    "torch",
    "torchvision",
    "pillow",
    "pandas",
    "openpyxl",
    "tqdm"
]
